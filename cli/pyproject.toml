[project]
name = "liveintent-cli"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["liveintent-shared", "click>=8.1"]

[project.scripts]
liveintent-spy = "liveintent_cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["liveintent_cli"]
