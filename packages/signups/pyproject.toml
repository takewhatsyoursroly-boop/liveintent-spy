[project]
name = "liveintent-signups"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "liveintent-shared",
  "playwright>=1.49",
  "imapclient>=3.0",
  "beautifulsoup4>=4.12",
  "httpx>=0.28",
  "structlog>=24.4",
  "click>=8.1",
]

[project.scripts]
liveintent-signups = "liveintent_signups.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["liveintent_signups"]
