[project]
name = "liveintent-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "liveintent-shared",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.28",
  "structlog>=24.4",
]

[project.optional-dependencies]
test = ["pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["liveintent_api"]
